name: Bug report
description: Something in Talkflow doesn't work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Talkflow version
      description: Shown at the bottom of Settings, or in the setup file name
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Installer, Listening / speech recognition, Answers / AI provider, Floating bar, Invisible mode, Inbox / summaries, Settings / speech models, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The end of %LOCALAPPDATA%\Talkflow\talkflow.log, if relevant. Read it first, and never paste API keys.
      render: text
