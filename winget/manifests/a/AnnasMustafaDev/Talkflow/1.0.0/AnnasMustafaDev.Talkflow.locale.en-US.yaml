ShortDescription: Real-time AI copilot for meetings and interviews, with local speech recognition.
Description: |-
  Talkflow listens to a meeting through your speakers, or takes a typed question, and drafts a clear answer in your own voice.
  Speech recognition runs locally with Whisper models; only text is sent to the AI provider you choose (OpenAI, Claude or Gemini) with your own API key.
